<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="İzmir Bakırçay Üniversitesi Tıp Fakültesi iletişim formu.">
    <title>Bize Ulaşın | İzmir Bakırçay Üniversitesi Tıp Fakültesi</title>
</head>
<body>
    <section class="container" aria-labelledby="iletisim-basligi">
        <h1 id="iletisim-basligi">Bize Ulaşın</h1>
        <p>Görüş, öneri ve taleplerinizi İzmir Bakırçay Üniversitesi Tıp Fakültesine iletebilirsiniz.</p>
        <p>E-posta: <a href="mailto:tip@bakircay.edu.tr">tip@bakircay.edu.tr</a></p>

        <form id="tip-fakultesi-iletisim" action="https://api.web3forms.com/submit"
              method="post" accept-charset="UTF-8">
            <!-- Buraya tip@bakircay.edu.tr için oluşturulan Web3Forms Access Key değerini yazın. -->
            <input type="hidden" name="access_key" value="6c37444b-b275-45ce-aaa4-128351247ae1">
            <input type="hidden" name="subject" value="Tıp Fakültesi | Bize Ulaşın Formu">
            <input type="hidden" name="from_name" value="İzmir Bakırçay Üniversitesi Tıp Fakültesi">
            <input type="checkbox" name="botcheck" hidden tabindex="-1" autocomplete="off">

            <p>
                <label class="form-label" for="tip-iletisim-ad">Ad</label><br>
                <input class="form-control" type="text" id="tip-iletisim-ad" name="Ad"
                       autocomplete="given-name" minlength="2" maxlength="50" required>
            </p>
            <p>
                <label class="form-label" for="tip-iletisim-soyad">Soyad</label><br>
                <input class="form-control" type="text" id="tip-iletisim-soyad" name="Soyad"
                       autocomplete="family-name" minlength="2" maxlength="50" required>
            </p>
            <p>
                <label class="form-label" for="tip-iletisim-telefon">Telefon numarası</label><br>
                <input class="form-control" type="tel" id="tip-iletisim-telefon" name="Telefon"
                       autocomplete="tel-national" inputmode="tel" maxlength="14"
                       pattern="0[0-9]{3} ?[0-9]{3} ?[0-9]{2} ?[0-9]{2}"
                       aria-describedby="tip-iletisim-telefon-ipucu" required><br>
                <small id="tip-iletisim-telefon-ipucu">İlk hanesi 0 olan 11 haneli numaranızı yazın.</small>
            </p>
            <p>
                <label class="form-label" for="tip-iletisim-eposta">E-posta adresi</label><br>
                <input class="form-control" type="email" id="tip-iletisim-eposta" name="email"
                       autocomplete="email" maxlength="254" required>
            </p>
            <p>
                <label class="form-label" for="tip-iletisim-mesaj">Mesaj</label><br>
                <textarea class="form-control" id="tip-iletisim-mesaj" name="Mesaj"
                          rows="5" cols="30" minlength="20"
                          aria-describedby="tip-iletisim-mesaj-ipucu" required></textarea><br>
                <small id="tip-iletisim-mesaj-ipucu">Mesajınız en az 20 karakter olmalıdır.</small>
            </p>
            <p>
                <button class="btn btn-primary" type="submit">Gönder</button>
            </p>
        </form>
    </section>
</body>
</html>
